title: Default page

fields:
  text:
    label: Text
    type: writer
  articles:
    label: Articles
    type: pagelist
  cover:
    type: filepicker
    layout: cardlets
    query: page.files.template('image')
    uploads: image
    multiple: false
    max: 1
  gallery:
    label: Gallery
    type: filepicker
    uploads: image
  files:
    label: false
    type: filelist
    create: false
    info: "{{ file.description }}"
    sortBy: filename

tabs:
  content:
    label:
      de: Inhalt
      en: Content
    icon: page
    columns:
      - width: 2/3
        fields:
          - text
          - articles
      - width: 1/3
        fields:
          - cover
          - gallery
  files:
    label:
      de: Dateiablage
      en: Files
    icon: attachment
    fields:
      - files
